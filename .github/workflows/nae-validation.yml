name: NAE validation

on:
  push:
    branches:
      - main
    paths:
      - "lib/nae/**"
      - "tools/nae/**"
      - "tests/nae-*.test.ts"
      - "tests/fixtures/**"
      - "data/nae/**"
      - "app/nae/**"
      - "app/fr/nae/**"
      - "lib/nae/presentation.tsx"
      - "app/sitemap.ts"
      - "lib/data/localeMap.ts"
      - "components/header/HeaderClient.tsx"
      - "components/nae/**"
      - "app/globals.css"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/nae-validation.yml"
  pull_request:
    paths:
      - "lib/nae/**"
      - "tools/nae/**"
      - "tests/nae-*.test.ts"
      - "tests/fixtures/**"
      - "data/nae/**"
      - "app/nae/**"
      - "app/fr/nae/**"
      - "lib/nae/presentation.tsx"
      - "app/sitemap.ts"
      - "lib/data/localeMap.ts"
      - "components/header/HeaderClient.tsx"
      - "components/nae/**"
      - "app/globals.css"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/nae-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parser-and-schema-tests:
    name: NAE validation and importer smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Run NAE tests
        run: bun run test:nae

      - name: Type-check application and NAE routes
        run: bun run tsc --noEmit --pretty false
      - name: Smoke-test NAE CSV importer
        run: |
          bun run nae:import -- --input tests/fixtures/nae-mini.csv --output "$RUNNER_TEMP/nae-import"
          bun -e '
            import assert from "node:assert/strict";
            import { readFile } from "node:fs/promises";
            const dir = `${process.env.RUNNER_TEMP}/nae-import`;
            const manifest = JSON.parse(await readFile(`${dir}/manifest.json`, "utf8"));
            const sector = JSON.parse(await readFile(`${dir}/sector-1.json`, "utf8"));
            assert.equal(manifest.record_count, 2);
            assert.equal(manifest.sector_counts["1"], 2);
            assert.equal(sector.length, 2);
            assert.equal(manifest.field_coverage.contenue_fr, 2);
            assert.equal(manifest.field_coverage.accessoires_fr, 1);
          '
