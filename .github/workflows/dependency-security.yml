name: Dependency Security Guard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-security:
    name: Verify patched Next.js and Sharp versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify package manifest and Bun lockfile
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const manifest = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const lock = JSON.parse(fs.readFileSync("bun.lock", "utf8"));

          function versionOf(spec, name) {
            if (typeof spec !== "string") {
              throw new Error(`Missing ${name} dependency in package.json`);
            }
            const match = spec.match(/(\d+)\.(\d+)\.(\d+)/);
            if (!match) throw new Error(`Cannot parse ${name} version: ${spec}`);
            return match.slice(1).map(Number);
          }

          function atLeast(actual, minimum) {
            for (let i = 0; i < 3; i++) {
              if (actual[i] > minimum[i]) return true;
              if (actual[i] < minimum[i]) return false;
            }
            return true;
          }

          function assertMinimum(label, actual, minimum) {
            if (!atLeast(actual, minimum)) {
              throw new Error(`${label} ${actual.join(".")} is below patched minimum ${minimum.join(".")}`);
            }
            console.log(`OK: ${label} ${actual.join(".")}`);
          }

          const lockedPackages = lock.packages || {};
          function lockedVersion(name) {
            const entry = lockedPackages[name];
            if (!Array.isArray(entry) || typeof entry[0] !== "string") {
              throw new Error(`Missing resolved ${name} entry in bun.lock`);
            }
            const match = entry[0].match(/@?(\d+)\.(\d+)\.(\d+)$/);
            if (!match) throw new Error(`Cannot parse locked ${name} version: ${entry[0]}`);
            return match.slice(1).map(Number);
          }

          const nextManifest = versionOf(manifest.dependencies?.next, "next");
          const sharpManifest = versionOf(manifest.devDependencies?.sharp ?? manifest.dependencies?.sharp, "sharp");
          assertMinimum("package.json next", nextManifest, [15, 5, 28]);
          assertMinimum("package.json sharp", sharpManifest, [0, 35, 5]);

          assertMinimum("bun.lock next", lockedVersion("next"), [15, 5, 28]);
          assertMinimum("bun.lock sharp", lockedVersion("sharp"), [0, 35, 5]);
          NODE
