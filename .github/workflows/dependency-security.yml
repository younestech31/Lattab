name: Dependency Security Guard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-security:
    name: Verify patched Next.js and Sharp versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify package manifest and Bun lockfile
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const manifest = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const lockText = fs.readFileSync("bun.lock", "utf8");

          function parseVersion(spec, name) {
            if (typeof spec !== "string") {
              throw new Error(`Missing ${name} dependency in package.json`);
            }
            const match = spec.match(/(\d+)\.(\d+)\.(\d+)/);
            if (!match) throw new Error(`Cannot parse ${name} version: ${spec}`);
            return match.slice(1).map(Number);
          }

          function atLeast(actual, minimum) {
            for (let i = 0; i < 3; i++) {
              if (actual[i] > minimum[i]) return true;
              if (actual[i] < minimum[i]) return false;
            }
            return true;
          }

          function assertMinimum(label, actual, minimum) {
            if (!atLeast(actual, minimum)) {
              throw new Error(`${label} ${actual.join(".")} is below patched minimum ${minimum.join(".")}`);
            }
            console.log(`OK: ${label} ${actual.join(".")}`);
          }

          function lockedVersion(name) {
            // bun.lock is JSONC (it contains trailing commas), not strict JSON.
            // Read the exact top-level package entry without JSON.parse().
            const escaped = name.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            const pattern = new RegExp(`^\\s*"${escaped}":\\s*\\["${escaped}@(\\d+\\.\\d+\\.\\d+)"`, "m");
            const match = lockText.match(pattern);
            if (!match) throw new Error(`Missing or unparseable resolved ${name} entry in bun.lock`);
            return match[1].split(".").map(Number);
          }

          const nextSpec = manifest.dependencies?.next ?? manifest.devDependencies?.next;
          const sharpSpec = manifest.dependencies?.sharp ?? manifest.devDependencies?.sharp;

          assertMinimum("package.json next", parseVersion(nextSpec, "next"), [15, 5, 28]);
          assertMinimum("package.json sharp", parseVersion(sharpSpec, "sharp"), [0, 35, 5]);
          assertMinimum("bun.lock next", lockedVersion("next"), [15, 5, 28]);
          assertMinimum("bun.lock sharp", lockedVersion("sharp"), [0, 35, 5]);
          NODE
